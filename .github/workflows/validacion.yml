name: Validación frontend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: front
      - uses: actions/checkout@v7
        with:
          repository: 1ASI0657-2620-9199/back
          ref: ${{ vars.BACKEND_REF || github.head_ref || github.ref_name }}
          path: back
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --check front/app.js
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            back/requirements.txt
            front/requirements-browser.txt
      - run: python -m pip install -r requirements.txt
        working-directory: back
      - run: python -m pip install -r front/requirements-browser.txt
      - run: python front/scripts/verificar_integracion.py
      - run: python -m playwright install --with-deps chromium
      - run: python front/scripts/check_ci.py --channel chromium
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-browser-evidence
          path: front/reports
