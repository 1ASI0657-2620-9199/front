resolver 127.0.0.11 valid=5s ipv6=off;
upstream financial { zone financial 64k; server financial-records:8000 resolve; }
upstream budgets { zone budgets 64k; server budget-service:8000 resolve; }
upstream notifications { zone notifications 64k; server notification-service:8000 resolve; }
upstream devices { zone devices 64k; server device-service:8000 resolve; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health { proxy_pass http://financial/health; }
    location = /docs { return 302 /services/financial/docs; }
    location = /openapi.json { proxy_pass http://financial/openapi.json; }
    location /api/v1/transactions { proxy_pass http://financial; }
    location /api/v1/summary { proxy_pass http://financial; }
    location /api/v1/budgets { proxy_pass http://budgets; }
    location /api/v1/budget-recommendations { proxy_pass http://budgets; }
    location /api/v1/reports/ { proxy_pass http://budgets; }
    location /api/v1/notifications { proxy_pass http://notifications; }
    location /api/v1/notification-preferences { proxy_pass http://notifications; }
    location /api/v1/devices { proxy_pass http://devices; }

    location /services/financial/ { proxy_pass http://financial/; }
    location /services/budgets/ { proxy_pass http://budgets/; }
    location /services/notifications/ { proxy_pass http://notifications/; }
    location /services/devices/ { proxy_pass http://devices/; }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
